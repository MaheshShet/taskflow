spring:
  application:
    name: taskflow-backend
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/taskflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
        hibernate:
          format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: "${JWT_SECRET:TaskFlowJwtSecretKeyForSigningTokens12345678901234567890676767}"
    expiration-ms: "${JWT_EXPIRATION_MS:3600000}"